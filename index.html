<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICR Manager v1.3.0</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#f5f5f3; --surface:#fff; --surface2:#f1efe8;
    --border:rgba(0,0,0,0.12); --border2:rgba(0,0,0,0.22);
    --text:#1a1a19; --text2:#5f5e5a; --text3:#888780;
    --blue-bg:#e6f1fb; --blue-text:#0c447c; --blue-border:#185fa5;
    --green-bg:#eaf3de; --green-text:#3b6d11;
    --amber-bg:#faeeda; --amber-text:#854f0b;
    --purple-bg:#eeedfe; --purple-text:#3c3489; --purple-border:#534ab7;
    --red-bg:#fcebeb; --red-text:#a32d2d; --red-border:#e24b4a;
    --radius:8px; --radius-lg:12px;
  }
  @media (prefers-color-scheme:dark) {
    :root {
      --bg:#1c1c1a; --surface:#2c2c2a; --surface2:#242422;
      --border:rgba(255,255,255,0.12); --border2:rgba(255,255,255,0.22);
      --text:#f0ede6; --text2:#b4b2a9; --text3:#888780;
      --blue-bg:#0c447c; --blue-text:#b5d4f4; --blue-border:#378add;
      --green-bg:#27500a; --green-text:#c0dd97;
      --amber-bg:#633806; --amber-text:#fac775;
      --purple-bg:#3c3489; --purple-text:#cecbf6; --purple-border:#7f77dd;
      --red-bg:#791f1f; --red-text:#f7c1c1; --red-border:#e24b4a;
    }
  }
  /* Reserve scrollbar gutter always — prevents layout shift when scrollbar appears/disappears.
     Also allows horizontal overflow on narrow viewports without a wrapper that breaks sticky. */
  html { overflow-y:scroll; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; line-height:1.5; overflow-x:auto; }
  .app { max-width:1200px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; font-weight:500; margin-bottom:20px; }

  input[type="text"], input[type="date"], select {
    background:var(--surface); border:0.5px solid var(--border2); border-radius:var(--radius);
    color:var(--text); font-family:inherit; font-size:14px; padding:7px 12px; outline:none; transition:border-color .15s;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color:var(--blue-border); box-shadow:0 0 0 2px rgba(55,138,221,.15); }

  button {
    background:var(--surface); border:0.5px solid var(--border2); border-radius:var(--radius);
    color:var(--text); cursor:pointer; font-family:inherit; font-size:13px; font-weight:500;
    padding:7px 14px; transition:background .12s; white-space:nowrap;
  }
  button:hover { background:var(--surface2); }
  button:active { transform:scale(0.98); }
  button.primary { background:var(--blue-bg); border-color:var(--blue-border); color:var(--blue-text); }
  button.danger  { background:var(--red-bg);  border-color:var(--red-border);  color:var(--red-text); }

  .notice-box { border-radius:var(--radius); padding:8px 12px; margin-bottom:6px; font-size:12px; line-height:1.6; }
  .notice-box:last-child { margin-bottom:0; }
  .notice-box.warning { background:var(--amber-bg); color:var(--amber-text); border:0.5px solid var(--amber-text); }
  .notice-box.danger  { background:var(--red-bg);   color:var(--red-text);   border:0.5px solid var(--red-border); }
  .notice-box.info    { background:var(--blue-bg);  color:var(--blue-text);  border:0.5px solid var(--blue-border); }
  .notice-box.success { background:var(--green-bg); color:var(--green-text); border:0.5px solid var(--green-text); }

  .import-hint {
    background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg);
    padding:12px 16px; margin-bottom:14px; font-size:13px; color:var(--text2);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .import-hint strong { color:var(--text); }

  /* Sync panel */
  .sync-panel { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg); margin-bottom:14px; overflow:hidden; }
  .sync-panel summary { padding:10px 16px; font-size:13px; font-weight:500; cursor:pointer; color:var(--text2); list-style:none; user-select:none; }
  .sync-panel summary::-webkit-details-marker { display:none; }
  .sync-panel[open] summary { border-bottom:0.5px solid var(--border); color:var(--text); }
  .sync-body { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:14px 16px; }
  @media (max-width:640px) { .sync-body { grid-template-columns:1fr; } }
  .sync-col { display:flex; flex-direction:column; gap:6px; }
  .sync-label { font-size:12px; color:var(--text3); }
  .sync-panel textarea {
    background:var(--surface2); border:0.5px solid var(--border2); border-radius:var(--radius);
    color:var(--text); font-family:monospace; font-size:11px; padding:8px 10px; resize:vertical; outline:none; width:100%;
  }
  .sync-panel textarea:focus { border-color:var(--blue-border); }
  .sync-panel select { font-size:12px; padding:4px 8px; }
  #qr-strip { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  #qr-strip .qr-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; }
  #qr-strip .qr-wrap span { font-size:11px; color:var(--text3); }
  #qr-strip canvas { border-radius:6px; cursor:pointer; border:0.5px solid var(--border); }

  /* Stats + notices row */
  .stats-notices-row { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stats-notices-row #notices { flex:1; min-width:200px; }
  .stats-row { display:flex; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .stat-card { background:var(--surface2); border-radius:var(--radius); padding:10px 16px; min-width:110px; }
  .stat-card .label { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; }
  .stat-card .value { font-size:22px; font-weight:500; margin-top:2px; }

  .search-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .search-row input { flex:1; min-width:180px; }

  /* ── Table layout ─────────────────────────────────────────────────────────── */
  /* Wrapper: border + radius only. No overflow — any non-visible overflow on an ancestor
     kills position:sticky on thead. Horizontal overflow falls through to body. */
  .table-wrap {
    border-radius:var(--radius-lg);
    border:0.5px solid var(--border);
  }
  table {
    width:100%;
    min-width:900px;          /* prevents squish before h-scroll kicks in */
    border-collapse:collapse;
    background:var(--surface);
    font-size:13px;
    table-layout:fixed;       /* fixed layout: columns honour explicit widths */
  }

  /* ── Column widths ─────────────────────────────────────────────────────────
     ICR IDs are always 9 chars (ICR + 6 digits). Qty ≤ 4 digits.
     SKU col holds 4 tags (~56px each) + add btn; wraps inside.
     CNC col holds 1 tag (~140px) + add btn.
     Rcvd col holds the inline edit (90px input + 2 small btns).
  */
  col.c-id       { width:118px; }
  col.c-qty      { width:58px; }
  col.c-custord  { width:116px; }
  col.c-date     { width:100px; }
  col.c-rcvd     { width:196px; }
  col.c-skus     { width:290px; }
  col.c-cnc      { width:220px; }
  col.c-archived { width:100px; }
  col.c-action   { width:40px; }

  thead th {
    background:var(--surface2);
    padding:10px 12px;
    text-align:left;
    font-weight:500;
    color:var(--text2);
    font-size:12px;
    border-bottom:0.5px solid var(--border);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    /* Sticky */
    position:sticky;
    top:0;
    z-index:2;
  }
  /* Re-draw bottom border on sticky header (border-bottom doesn't paint on sticky in some browsers) */
  thead th::after {
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:0.5px;
    background:var(--border);
    pointer-events:none;
  }

  /* Filterable column headers */
  th.filterable { cursor:pointer; user-select:none; }
  th.filterable:hover { color:var(--text); background:var(--surface); }
  th.filter-active { color:var(--blue-text) !important; background:var(--blue-bg) !important; }
  .filter-badge {
    display:inline-block; margin-left:5px;
    background:var(--blue-text); color:var(--blue-bg);
    border-radius:3px; padding:0 4px; font-size:10px; font-weight:600;
    vertical-align:middle; line-height:16px;
  }
  th.filter-active .filter-badge { color:#fff; }

  tbody tr { border-bottom:0.5px solid var(--border); transition:background .1s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:var(--surface2); }
  td { padding:9px 12px; vertical-align:top; overflow:hidden; }

  /* Order ID cell */
  .order-id { font-family:monospace; font-size:12px; font-weight:500; cursor:pointer; user-select:none; white-space:nowrap; }
  .order-id:hover { color:var(--blue-text); }
  .copy-hint { font-size:10px; color:var(--text3); margin-left:4px; opacity:0; transition:opacity .15s; }
  tr:hover .copy-hint { opacity:1; }

  .badge { display:inline-block; border-radius:4px; padding:2px 7px; font-size:11px; font-weight:500; white-space:nowrap; }
  .badge.yes { background:var(--green-bg); color:var(--green-text); }
  .badge.no  { background:var(--surface2); color:var(--text3); }

  /* Tags cells: flex-wrap so overflow wraps within fixed column width */
  .tags-cell { display:flex; gap:4px; flex-wrap:wrap; align-items:flex-start; min-height:22px; }
  .inline-tag-form { display:inline-flex; gap:4px; align-items:center; flex-shrink:0; }

  .sku-tag { background:var(--blue-bg); color:var(--blue-text); border-radius:4px; padding:2px 7px; font-size:11px; font-family:monospace; cursor:pointer; border:none; white-space:nowrap; }
  .sku-tag:hover { opacity:.75; }
  .cnc-tag { background:var(--purple-bg); color:var(--purple-text); border-radius:4px; padding:2px 7px; font-size:11px; font-family:monospace; cursor:pointer; border:none; white-space:nowrap; }
  .cnc-tag:hover { opacity:.75; }

  .add-tag-btn { background:none; border:0.5px dashed var(--border2); border-radius:4px; color:var(--text3); font-size:11px; padding:2px 7px; cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .add-tag-btn:hover { border-color:var(--blue-border); color:var(--blue-text); }
  .add-tag-btn.cnc:hover { border-color:var(--purple-border); color:var(--purple-text); }

  .inline-input { font-size:12px; padding:2px 6px; width:96px; border-radius:4px; background:var(--surface); border:0.5px solid var(--border2); color:var(--text); font-family:monospace; outline:none; flex-shrink:0; }
  .inline-input:focus { border-color:var(--blue-border); }

  /* Received date cell */
  .rcvd-cell { white-space:nowrap; }
  .rcvd-display { font-size:12px; color:var(--text3); cursor:pointer; border-radius:4px; padding:1px 4px; display:inline-block; }
  .rcvd-display:hover { background:var(--surface2); color:var(--blue-text); }
  .rcvd-edit { display:none; gap:4px; align-items:center; flex-wrap:nowrap; }
  .rcvd-edit input[type="text"].rcvd-input { font-size:11px; padding:2px 6px; width:90px; border-radius:4px; font-family:monospace; }

  .remove-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:13px; padding:2px 4px; border-radius:4px; }
  .remove-btn:hover { color:var(--red-text); background:var(--red-bg); }

  /* Row states */
  .highlight    { background:rgba(239,159,39,0.2); }
  .copied-row   { background:rgba(55,138,221,0.12); }
  .copied-row:hover { background:rgba(55,138,221,0.18) !important; }
  .archived-row { opacity:.55; }
  .archived-id  { color:var(--text3) !important; }

  /* Empty state inside tbody */
  .empty-row td { padding:40px 12px; text-align:center; color:var(--text3); font-size:13px; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border-radius:var(--radius-lg); border:0.5px solid var(--border2); padding:20px 24px; width:90%; max-width:440px; }
  .modal h3 { font-size:15px; font-weight:500; margin-bottom:12px; }
  .modal p  { font-size:13px; color:var(--text2); margin-bottom:14px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }

  #paste-status { font-size:12px; color:var(--text3); padding:4px 0; min-height:20px; }
</style>
</head>
<body>
<div class="app">
  <h1>ICR Manager</h1>
  <div id="notices-top" style="display:none"></div>

  <div class="import-hint">
    <div><strong>Importing:</strong> paste anywhere on the page (not into a search field) to add to buffer. When done pasting, click <strong>Commit import</strong>.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-left:auto;">
      <span id="paste-status"></span>
      <button class="primary" onclick="commitImport()">Commit import</button>
      <button onclick="clearBuffer()">Clear buffer</button>
    </div>
  </div>

  <details class="sync-panel">
    <summary>&#8597; Sync state between machines</summary>
    <div class="sync-body">
      <div class="sync-col">
        <div class="sync-label" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span>Export</span>
          <span style="font-size:11px;color:var(--text3);">QR chunk size:</span>
          <select id="qr-size-select">
            <option value="486">Small (~500 chars, easiest to scan)</option>
            <option value="1486" selected>Medium (~1500 chars)</option>
            <option value="4282">Large (~4300 chars, single QR if possible)</option>
          </select>
        </div>
        <div id="export-info" style="font-size:12px;color:var(--text3);min-height:16px;"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center;">
          <button class="primary" id="btn-export">Generate QR codes</button>
          <button id="btn-copy-full">Copy full string</button>
        </div>
        <div id="qr-strip"></div>
      </div>
      <div class="sync-col">
        <div class="sync-label">Import &mdash; paste full exported string, or scan QR chunks one at a time</div>
        <textarea id="import-box" rows="5" placeholder="Paste ICRv1: string here&#10;&#10;If scanning QR codes: paste each chunk and click Import. Chunks accumulate until all are received."></textarea>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center;">
          <button class="primary" id="btn-import">Import state</button>
          <button id="btn-clear-import">Clear</button>
          <span id="import-status" style="font-size:12px;color:var(--text3);"></span>
        </div>
        <div id="scan-progress" style="margin-top:8px;font-size:12px;color:var(--text3);"></div>
      </div>
    </div>
  </details>

  <div class="stats-notices-row">
    <div class="stats-row" id="stats-row"></div>
    <div id="notices"></div>
  </div>

  <div class="search-row">
    <input type="text" id="sku-search" placeholder="Search by SKU or CNC/CSA&hellip;" oninput="renderTable()" />
    <input type="text" id="id-search"  placeholder="Search by order ID&hellip;" oninput="renderTable()" />
    <button onclick="clearSearch()">Clear search</button>
    <button class="danger" onclick="confirmClearAll()">Clear all orders</button>
  </div>

  <div id="table-container"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p  id="modal-body"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const VERSION = 'v1.3.0';

// ── Storage keys ──────────────────────────────────────────────────────────────
const STORAGE_KEY  = 'order_manager_v1';
const HISTORY_KEY  = 'order_manager_history_v1';

let orders         = {};
let history_orders = {};
let buffer         = [];
let showHistory    = false;
let copiedOrderId  = null;
let scannedChunks  = {};
let lastExportChunks = [];

// ── Column filters ────────────────────────────────────────────────────────────
let qtyFilter = 'all';   // 'all' | 'le100' | 'gt100'
let skuFilter = 'all';   // 'all' | 'sku'   | 'nosku'
let ageFilter = 'all';   // 'all' | 'old'   (receivedDate older than 14 days)

const QTY_STATES = ['all', 'le100', 'gt100'];
const SKU_STATES = ['all', 'sku', 'nosku'];
const AGE_STATES = ['all', 'old'];

const QTY_BADGES = { all: null, le100: '\u2264100', gt100: '>100' };
const SKU_BADGES = { all: null, sku: 'has SKU', nosku: 'no SKU' };
const AGE_BADGES = { all: null, old: '>2 wks' };

function cycleFilter(which) {
  if (which === 'qty') { const i = QTY_STATES.indexOf(qtyFilter); qtyFilter = QTY_STATES[(i+1) % QTY_STATES.length]; }
  else if (which === 'sku') { const i = SKU_STATES.indexOf(skuFilter); skuFilter = SKU_STATES[(i+1) % SKU_STATES.length]; }
  else if (which === 'age') { const i = AGE_STATES.indexOf(ageFilter); ageFilter = AGE_STATES[(i+1) % AGE_STATES.length]; }
  renderTable();
}

function applyFilters(rows) {
  const cutoffStr = new Date(Date.now() - 14*24*60*60*1000).toISOString().slice(0,10);
  if (qtyFilter === 'le100') rows = rows.filter(function(o){ return o.qty <= 100; });
  else if (qtyFilter === 'gt100') rows = rows.filter(function(o){ return o.qty > 100; });
  if (skuFilter === 'sku')   rows = rows.filter(function(o){ return o.skus && o.skus.length > 0; });
  else if (skuFilter === 'nosku') rows = rows.filter(function(o){ return !o.skus || o.skus.length === 0; });
  if (ageFilter === 'old') rows = rows.filter(function(o){ return o.receivedDate && o.receivedDate < cutoffStr; });
  return rows;
}

// ── Persist ───────────────────────────────────────────────────────────────────
function load() {
  try { const s = localStorage.getItem(STORAGE_KEY);  if (s) orders         = JSON.parse(s); } catch(e) { orders = {}; }
  try { const s = localStorage.getItem(HISTORY_KEY);  if (s) history_orders = JSON.parse(s); } catch(e) { history_orders = {}; }
  for (const o of Object.values(orders))         { if (!o.skus) o.skus=[]; if (!o.cncs) o.cncs=[]; }
  for (const o of Object.values(history_orders)) { if (!o.skus) o.skus=[]; if (!o.cncs) o.cncs=[]; }
  // Migration v1.1.0: strip hasCustomerOrders from history
  let dirty = false;
  for (const o of Object.values(history_orders)) { if ('hasCustomerOrders' in o) { delete o.hasCustomerOrders; dirty=true; } }
  if (dirty) saveHistory();
}
function save()        { localStorage.setItem(STORAGE_KEY,  JSON.stringify(orders)); }
function saveHistory() { localStorage.setItem(HISTORY_KEY,  JSON.stringify(history_orders)); }
function historyKB()   { return (JSON.stringify(history_orders).length / 1024).toFixed(1); }

// ── Base36 ────────────────────────────────────────────────────────────────────
const B36 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function b36encode(bytes) {
  let nums = Array.from(bytes), result = '', leadingZeros = 0;
  for (const b of nums) { if (b === 0) leadingZeros++; else break; }
  while (nums.length) {
    let rem = 0, next = [];
    for (const n of nums) { const cur = rem*256+n, q = Math.floor(cur/36); rem = cur%36; if (next.length||q) next.push(q); }
    result = B36[rem] + result; nums = next;
  }
  return '0'.repeat(leadingZeros) + (result || '0');
}
function b36decode(str) {
  str = str.toUpperCase(); let nums = [0];
  for (const ch of str) {
    const val = B36.indexOf(ch); if (val<0) throw new Error('Invalid base36: '+ch);
    let carry = val;
    for (let i=nums.length-1; i>=0; i--) { const cur=nums[i]*36+carry; nums[i]=cur&0xff; carry=cur>>8; }
    while (carry) { nums.unshift(carry&0xff); carry>>=8; }
  }
  return new Uint8Array(nums);
}

// ── Encode / decode state ─────────────────────────────────────────────────────
function encodeChunked(obj, chunkSize) {
  const compressed = pako.deflate(new TextEncoder().encode(JSON.stringify(obj)), { level:9 });
  const full = b36encode(compressed);
  const chunks = [];
  for (let i=0; i<full.length; i+=chunkSize) chunks.push(full.slice(i, i+chunkSize));
  return chunks.map((ch,i) => 'ICRv1:'+(i+1)+'/'+chunks.length+':'+ch);
}
function decodeChunks(strings) {
  const parsed = [];
  for (const s of strings) {
    const m = s.trim().match(/^ICRv1:(\d+)\/(\d+):([0-9A-Za-z]+)$/);
    if (!m) throw new Error('Invalid chunk: "'+s.slice(0,40)+'"');
    parsed.push({ n:parseInt(m[1]), t:parseInt(m[2]), data:m[3].toUpperCase() });
  }
  if (!parsed.length) throw new Error('No valid chunks');
  const T = parsed[0].t;
  if (!parsed.every(p=>p.t===T)) throw new Error('Mismatched chunk totals');
  parsed.sort((a,b)=>a.n-b.n);
  const missing = [];
  for (let i=1; i<=T; i++) if (!parsed.find(p=>p.n===i)) missing.push(i);
  if (missing.length) throw new Error('Missing chunks: '+missing.join(', '));
  const compressed = b36decode(parsed.map(p=>p.data).join(''));
  return JSON.parse(new TextDecoder().decode(pako.inflate(compressed)));
}

// ── QR rendering ──────────────────────────────────────────────────────────────
function renderQRChunks(chunks) {
  const strip = document.getElementById('qr-strip'); strip.innerHTML = '';
  const sz = chunks.length === 1 ? 240 : 180;
  chunks.forEach(function(text, i) {
    const wrap = document.createElement('div'); wrap.className = 'qr-wrap';
    const lbl  = document.createElement('span'); lbl.textContent = chunks.length===1 ? 'Scan to import' : (i+1)+' / '+chunks.length;
    const canvas = document.createElement('canvas'); canvas.width=sz; canvas.height=sz;
    canvas.title = 'Click to copy this chunk';
    canvas.addEventListener('click', function(){ copyToClip(text); });
    wrap.appendChild(lbl); wrap.appendChild(canvas); strip.appendChild(wrap);
    setTimeout(function() {
      try {
        const tmp = document.createElement('div');
        new QRCode(tmp, { text:text.toUpperCase(), width:sz, height:sz, correctLevel:QRCode.CorrectLevel.M });
        setTimeout(function() {
          const el = tmp.querySelector('canvas') || tmp.querySelector('img');
          if (!el) return;
          const ctx = canvas.getContext('2d');
          if (el.tagName==='CANVAS') { ctx.drawImage(el,0,0,sz,sz); }
          else { const img=new Image(); img.onload=function(){ ctx.drawImage(img,0,0,sz,sz); }; img.src=el.src; }
        }, 80);
      } catch(e) {
        const ctx = canvas.getContext('2d'); ctx.fillStyle='#888'; ctx.font='12px sans-serif';
        ctx.fillText('QR error: '+e.message, 4, sz/2);
      }
    }, i*60);
  });
}

// ── Export ────────────────────────────────────────────────────────────────────
function doExport() {
  try {
    const chunkSize = parseInt(document.getElementById('qr-size-select').value, 10);
    const payload = { active:orders, history:history_orders, exportedAt:new Date().toISOString() };
    lastExportChunks = encodeChunked(payload, chunkSize);
    const total = lastExportChunks.reduce(function(s,c){ return s+c.length; }, 0);
    document.getElementById('export-info').textContent = lastExportChunks.length+' QR code(s) \u2014 '+total+' chars total ('+( total/1024).toFixed(1)+' KB)';
    renderQRChunks(lastExportChunks);
  } catch(e) { document.getElementById('export-info').textContent = 'Error: '+e.message; }
}
async function copyToClip(text) {
  try { await navigator.clipboard.writeText(text); }
  catch(e) { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  showNotice('Copied to clipboard', 'success', 2000);
}
function copyFullExport() {
  if (!lastExportChunks.length) { doExport(); setTimeout(copyFullExport, 300); return; }
  copyToClip(lastExportChunks.join('\n'));
}

// ── Import ────────────────────────────────────────────────────────────────────
function renderScanProgress() {
  const el = document.getElementById('scan-progress');
  const keys = Object.keys(scannedChunks).map(Number).sort(function(a,b){ return a-b; });
  if (!keys.length) { el.textContent=''; return; }
  const T = scannedChunks[keys[0]].t, missing = [];
  for (let i=1; i<=T; i++) if (!scannedChunks[i]) missing.push(i);
  el.innerHTML = 'Scanned: '+keys.join(', ')+' of '+T+(missing.length ? ' \u2014 still need: <strong style="color:var(--amber-text)">'+missing.join(', ')+'</strong>' : ' \u2014 <strong style="color:var(--green-text)">all chunks received</strong>');
}
function clearImportUI() {
  document.getElementById('import-box').value='';
  document.getElementById('import-status').textContent='';
  document.getElementById('scan-progress').textContent='';
  scannedChunks={};
}
function doImport() {
  const raw = document.getElementById('import-box').value.trim();
  const status = document.getElementById('import-status');
  if (!raw) { status.textContent='Nothing to import.'; return; }
  const lines = raw.split(/[\n\r]+/).map(function(l){ return l.trim(); }).filter(function(l){ return l.indexOf('ICRv1:')===0; });
  if (!lines.length) { status.textContent='No ICRv1 strings found.'; return; }
  try {
    for (const line of lines) {
      const m = line.match(/^ICRv1:(\d+)\/(\d+):([0-9A-Za-z]+)$/);
      if (m) { const n=parseInt(m[1]), t=parseInt(m[2]); scannedChunks[n]={ n:n, t:t, data:m[3].toUpperCase() }; }
    }
    renderScanProgress();
    const keys = Object.keys(scannedChunks).map(Number);
    if (!keys.length) { status.textContent='No valid chunks parsed.'; return; }
    const T = scannedChunks[keys[0]].t, missing=[];
    for (let i=1; i<=T; i++) if (!scannedChunks[i]) missing.push(i);
    if (missing.length) { status.textContent='Got '+keys.length+'/'+T+' chunks. Still need: '+missing.join(', '); return; }
    const chunkStrings = Object.values(scannedChunks).map(function(c){ return 'ICRv1:'+c.n+'/'+c.t+':'+c.data; });
    const payload = decodeChunks(chunkStrings);
    if (!payload.active || !payload.history) throw new Error('Missing fields in payload');
    const activeCount = Object.keys(payload.active).length;
    const histCount   = Object.keys(payload.history).length;
    showModal('Import state?', 'Replace current state with: '+activeCount+' active + '+histCount+' archived orders (exported '+(payload.exportedAt||'').slice(0,10)+'). Existing data will be overwritten.', [
      { label:'Import', cls:'primary', action:function() {
        orders=payload.active; history_orders=payload.history;
        for (const o of Object.values(orders))         { if (!o.skus) o.skus=[]; if (!o.cncs) o.cncs=[]; }
        for (const o of Object.values(history_orders)) { if (!o.skus) o.skus=[]; if (!o.cncs) o.cncs=[]; }
        save(); saveHistory(); clearImportUI(); renderAll(); closeModal();
        showNotice('Imported '+activeCount+' active + '+histCount+' archived orders.', 'success', 4000);
      }},
      { label:'Cancel', cls:'', action:closeModal }
    ]);
  } catch(e) { status.textContent='Error: '+e.message; }
}

// ── Date normalisation ────────────────────────────────────────────────────────
function normalizeDate(raw) {
  if (!raw) return null;
  const s = raw.trim(); if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return isValidISODate(s) ? s : null;
  if (/^\d{8}$/.test(s)) { const iso=s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); return isValidISODate(iso)?iso:null; }
  const dot = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (dot) { const iso=dot[3]+'-'+pad2(dot[2])+'-'+pad2(dot[1]); return isValidISODate(iso)?iso:null; }
  const sl = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (sl) {
    const a=parseInt(sl[1],10), b=parseInt(sl[2],10), y=sl[3];
    let day,month;
    if (a>12) { day=a; month=b; } else if (b>12) { day=b; month=a; } else { day=a; month=b; }
    const iso=y+'-'+pad2(month)+'-'+pad2(day); return isValidISODate(iso)?iso:null;
  }
  return null;
}
function pad2(n) { return String(n).padStart(2,'0'); }
function isValidISODate(iso) {
  const p=iso.split('-'); if (p.length!==3) return false;
  const y=parseInt(p[0],10),m=parseInt(p[1],10),d=parseInt(p[2],10);
  if (!y||!m||!d||m<1||m>12||d<1||d>31) return false;
  const dt=new Date(y,m-1,d);
  return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
}

// ── Paste parsing ─────────────────────────────────────────────────────────────
function parseRaw(raw) {
  const cleaned = raw.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\r/g,'');
  const lines = cleaned.split('\n'), result=[];
  for (const line of lines) {
    const trimmed = line.trim(); if (!trimmed) continue;
    const asDate = normalizeDate(trimmed);
    if (asDate) { if (result.length && !result[result.length-1].date) result[result.length-1].date=asDate; continue; }
    let id=null, qty=0, hasCustomerOrders=false;
    const cols = trimmed.split(/\t+/).map(function(c){ return c.trim(); }).filter(Boolean);
    if (cols.length>=3) {
      const m=cols[0].match(/(?:_*)(ICR\d+)(?:_*)/i);
      if (m && cols[1] && cols[1].toLowerCase().includes('incoming')) { id=m[1]; qty=parseInt(cols[2])||0; hasCustomerOrders=!!(cols[3]&&cols[3].toLowerCase()==='yes'); }
    }
    if (!id) { const m=trimmed.match(/(?:_*)(ICR\d+)(?:_*)\s*Incoming\s*(\d+)\s*(Yes|No)/i); if (m) { id=m[1]; qty=parseInt(m[2]); hasCustomerOrders=m[3].toLowerCase()==='yes'; } }
    if (id) result.push({ id:id, qty:qty, hasCustomerOrders:hasCustomerOrders, date:null });
  }
  return result;
}

document.addEventListener('paste', function(e) {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA') return;
  e.preventDefault();
  const raw = (e.clipboardData||window.clipboardData).getData('text/plain');
  if (!raw) return;
  const parsed = parseRaw(raw);
  if (!parsed.length) {
    const preview = raw.split('\n').slice(0,3).map(function(l){ return '"'+l.trim()+'"'; }).join(', ');
    showNotice('No valid order lines found. First lines: '+preview, 'warning', 8000); return;
  }
  for (const o of parsed) { if (!buffer.find(function(b){ return b.id===o.id; })) buffer.push(o); }
  updatePasteStatus();
});
function updatePasteStatus() { document.getElementById('paste-status').textContent = buffer.length ? buffer.length+' order(s) in buffer' : ''; }
function clearBuffer() { buffer=[]; updatePasteStatus(); }

// ── Commit import ─────────────────────────────────────────────────────────────
function commitImport() {
  if (!buffer.length) { showNotice('Buffer is empty \u2014 paste order data anywhere on the page first.', 'warning', 3000); return; }
  const prevIds = new Set(Object.keys(orders));
  const newIds  = new Set(buffer.map(function(o){ return o.id; }));
  const disappeared        = [...prevIds].filter(function(id){ return !newIds.has(id); });
  const lostCustomerOrders = [...prevIds].filter(function(id) {
    if (!newIds.has(id)) return false;
    const next = buffer.find(function(b){ return b.id===id; });
    return orders[id].hasCustomerOrders && next && !next.hasCustomerOrders;
  });
  const today = new Date().toISOString().slice(0,10);
  for (const id of disappeared) {
    const archived = Object.assign({}, orders[id], { archivedAt:today });
    delete archived.hasCustomerOrders;
    history_orders[id]=archived; delete orders[id];
  }
  saveHistory();
  for (const o of buffer) {
    if (!orders[o.id]) {
      const hist = history_orders[o.id];
      orders[o.id] = Object.assign({}, o, { skus:hist?[...(hist.skus||[])]:[], cncs:hist?[...(hist.cncs||[])]:[], receivedDate:today });
    } else {
      orders[o.id].qty=o.qty; orders[o.id].hasCustomerOrders=o.hasCustomerOrders;
      if (o.date && !orders[o.id].date) orders[o.id].date=o.date;
      if (!orders[o.id].cncs) orders[o.id].cncs=[];
      if (!orders[o.id].skus) orders[o.id].skus=[];
    }
  }
  buffer=[]; updatePasteStatus(); save(); renderAll();
  const msgs=[];
  if (disappeared.length)        msgs.push({ type:'info',    label:'Handled',                 text:disappeared.length+' order(s) no longer visible: '+disappeared.slice(0,10).join(', ')+(disappeared.length>10?'\u2026':'') });
  if (lostCustomerOrders.length) msgs.push({ type:'warning', label:'Lost customer-order flag', text:lostCustomerOrders.length+' order(s): '+lostCustomerOrders.slice(0,10).join(', ')+(lostCustomerOrders.length>10?'\u2026':'') });
  if (!msgs.length) { showNotice('Import committed \u2014 '+Object.keys(orders).length+' active orders.', 'success', 4000); return; }
  const el=document.getElementById('notices'); el.innerHTML='';
  msgs.forEach(function(m) {
    const d=document.createElement('div'); d.className='notice-box '+m.type;
    d.innerHTML='<strong>'+m.label+':</strong> '+m.text+' <button style="float:right;background:none;border:none;cursor:pointer;font-size:16px;color:inherit;" onclick="this.parentElement.remove()">&#215;</button>';
    el.appendChild(d);
  });
}

    '<div class="stat-card" style="padding:10px 14px;">'+

function thHtml(label, badge, filterKey, isActive) {
  const badgeHtml = badge
    ? '<span class="filter-badge">'+badge+'</span>'
    : (label ? ' <span style="font-size:10px;opacity:.4;">&#9662;</span>' : '<span style="font-size:10px;opacity:.4;">&#9662;</span>');
  return '<th class="filterable'+(isActive?' filter-active':'')+'" onclick="cycleFilter(\''+filterKey+'\')" title="Click to filter">'+label+badgeHtml+'</th>';
}

function renderTable() {
  const skuQ = document.getElementById('sku-search').value.trim().toLowerCase();
  const idQ  = document.getElementById('id-search').value.trim().toLowerCase();
  let rows = Object.values(orders).map(function(o){ return Object.assign({},o,{_archived:false}); });
  if (showHistory) rows = rows.concat(Object.values(history_orders).map(function(o){ return Object.assign({},o,{_archived:true}); }));
  if (skuQ) rows = rows.filter(function(o){
    return (o.skus&&o.skus.some(function(s){ return s.toLowerCase().includes(skuQ); }))||(o.cncs&&o.cncs.some(function(c){ return c.toLowerCase().includes(skuQ); }));
  });
  if (idQ) rows = rows.filter(function(o){ return o.id.toLowerCase().includes(idQ); });

  // Column filters apply only to active rows
  const active   = applyFilters(rows.filter(function(o){ return !o._archived; }));
  const archived = rows.filter(function(o){ return o._archived; });
  rows = active.concat(archived);
  rows.sort(function(a,b){ return a.id.localeCompare(b.id); });

  const qtyActive = qtyFilter!=='all', skuActive=skuFilter!=='all', ageActive=ageFilter!=='all';
  const colsHtml = showHistory
    ? '<col class="c-id"><col class="c-qty"><col class="c-custord"><col class="c-date"><col class="c-rcvd"><col class="c-skus"><col class="c-cnc"><col class="c-archived"><col class="c-action">'
    : '<col class="c-id"><col class="c-qty"><col class="c-custord"><col class="c-date"><col class="c-rcvd"><col class="c-skus"><col class="c-cnc"><col class="c-action">';
  const totalCols = showHistory ? 9 : 8;

  let html = '<div class="table-wrap"><table>'+colsHtml+'<thead><tr>'+
    '<th>Order ID</th>'+
    thHtml(qtyActive ? '' : 'Qty', QTY_BADGES[qtyFilter], 'qty', qtyActive)+
    '<th>Customer orders</th>'+
    '<th>Date</th>'+
    thHtml('Rcvd', AGE_BADGES[ageFilter], 'age', ageActive)+
    thHtml('SKUs', SKU_BADGES[skuFilter], 'sku', skuActive)+
    '<th>CNC / CSA</th>'+
    (showHistory ? '<th style="color:var(--text3);font-weight:400;">Archived</th>' : '')+
    '<th></th></tr></thead><tbody>';

  if (!rows.length) {
    html += '<tr class="empty-row"><td colspan="'+totalCols+'">No orders match your search or filters.</td></tr>';
  } else {
    rows.forEach(function(o) {
      const hlSku = skuQ&&o.skus&&o.skus.some(function(s){ return s.toLowerCase().includes(skuQ); });
      const hlCnc = skuQ&&o.cncs&&o.cncs.some(function(c){ return c.toLowerCase().includes(skuQ); });
      const rowClass = (hlSku||hlCnc)?'highlight':(o.id===copiedOrderId)?'copied-row':o._archived?'archived-row':'';

      const skuTags = (o.skus||[]).map(function(s){
        return '<button class="sku-tag'+(skuQ&&s.toLowerCase().includes(skuQ)?' highlight':'')+'" onclick="removeTag(\''+o.id+'\',\'sku\',\''+s+'\')" title="Remove">'+s+' \xd7</button>';
      }).join('');
      const cncTags = (o.cncs||[]).map(function(c){
        return '<button class="cnc-tag'+(skuQ&&c.toLowerCase().includes(skuQ)?' highlight':'')+'" onclick="removeTag(\''+o.id+'\',\'cnc\',\''+c+'\')" title="Remove">'+c+' \xd7</button>';
      }).join('');

      const skuInput = o._archived ? '' :
        '<button class="add-tag-btn" onclick="startAddTag(\''+o.id+'\',\'sku\')">+ SKU</button>'+
        '<span id="tag-input-sku-'+o.id+'" class="inline-tag-form" style="display:none;">'+
          '<input class="inline-input" type="text" id="tag-val-sku-'+o.id+'" placeholder="SKU" onkeydown="tagKeydown(event,\''+o.id+'\',\'sku\')">'+
          '<button style="font-size:11px;padding:2px 6px;" onclick="confirmAddTag(\''+o.id+'\',\'sku\')">Add</button>'+
          '<button style="font-size:11px;padding:2px 6px;" onclick="cancelAddTag(\''+o.id+'\',\'sku\')">\xd7</button>'+
        '</span>';
      const cncInput = o._archived ? '' : '<button class="add-tag-btn cnc" onclick="addCncFromClipboard(\''+o.id+'\')">+ CNC/CSA</button>';
      const removeBtn = o._archived
        ? '<button class="remove-btn" onclick="confirmDeleteArchived(\''+o.id+'\')" title="Delete from history">\u2715</button>'
        : '<button class="remove-btn" onclick="confirmRemoveOrder(\''+o.id+'\')" title="Archive order">\u2715</button>';

      let rcvdCell;
      if (o._archived) {
        rcvdCell = '<td class="rcvd-cell" style="color:var(--text3);font-size:12px;">'+(o.receivedDate||'\u2014')+'</td>';
      } else {
        const displayVal = o.receivedDate || '\u2014';
        rcvdCell =
          '<td class="rcvd-cell">'+
            '<span class="rcvd-display" id="rcvd-disp-'+o.id+'" onclick="startEditRcvd(\''+o.id+'\')" title="Click to edit received date">'+displayVal+'</span>'+
            '<span class="rcvd-edit" id="rcvd-edit-'+o.id+'">'+
              '<input type="text" class="rcvd-input inline-input" id="rcvd-val-'+o.id+'" placeholder="YYYY-MM-DD" maxlength="10" onkeydown="rcvdKeydown(event,\''+o.id+'\')">'+
              '<button style="font-size:11px;padding:2px 5px;" onclick="confirmEditRcvd(\''+o.id+'\')">Set</button>'+
              '<button style="font-size:11px;padding:2px 5px;" onclick="cancelEditRcvd(\''+o.id+'\')">\xd7</button>'+
            '</span>'+
          '</td>';
      }

      html += '<tr class="'+rowClass+'">'+
        '<td class="order-id'+(o._archived?' archived-id':'')+'" onclick="copyOrderId(\''+o.id+'\')" title="Click to copy">'+o.id+'<span class="copy-hint">copy</span></td>'+
        '<td>'+o.qty+'</td>'+
        '<td><span class="badge '+(o.hasCustomerOrders?'yes':'no')+'">'+(o.hasCustomerOrders?'Yes':'No')+'</span></td>'+
        '<td style="color:var(--text3);font-size:12px;">'+(o.date||'\u2014')+'</td>'+
        rcvdCell+
        '<td><div class="tags-cell">'+skuTags+skuInput+'</div></td>'+
        '<td><div class="tags-cell">'+cncTags+cncInput+'</div></td>'+
        (showHistory ? '<td style="color:var(--text3);font-size:12px;">'+(o._archived?(o.archivedAt||'\u2014'):'')+'</td>' : '')+
        '<td>'+removeBtn+'</td>'+
      '</tr>';
    });
  }
  html += '</tbody></table></div>';
  document.getElementById('table-container').innerHTML = html;
}

function renderAll() { renderStats(); renderTable(); }
function toggleHistory() { showHistory=!showHistory; renderAll(); }

// ── Received date inline edit ─────────────────────────────────────────────────
function startEditRcvd(id) {
  document.getElementById('rcvd-disp-'+id).style.display='none';
  const editEl=document.getElementById('rcvd-edit-'+id); editEl.style.display='inline-flex';
  const inp=document.getElementById('rcvd-val-'+id);
  const existing=orders[id]&&orders[id].receivedDate;
  inp.value=existing||(new Date().toISOString().slice(0,7)+'-');
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}
function cancelEditRcvd(id) {
  document.getElementById('rcvd-edit-'+id).style.display='none';
  document.getElementById('rcvd-disp-'+id).style.display='';
}
function confirmEditRcvd(id) {
  const val=document.getElementById('rcvd-val-'+id).value.trim();
  const normalized=normalizeDate(val);
  if (val&&!normalized) { showNotice('Date must be YYYY-MM-DD, DD.MM.YYYY, DD/MM/YYYY, or 8 digits YYYYMMDD','warning',4000); return; }
  orders[id].receivedDate=normalized||null; save(); renderTable();
}
function rcvdKeydown(e,id) { if (e.key==='Enter') confirmEditRcvd(id); if (e.key==='Escape') cancelEditRcvd(id); }

// ── Tag / SKU / CNC ───────────────────────────────────────────────────────────
function startAddTag(id,type) { document.getElementById('tag-input-'+type+'-'+id).style.display='inline-flex'; document.getElementById('tag-val-'+type+'-'+id).focus(); }
function cancelAddTag(id,type) { document.getElementById('tag-input-'+type+'-'+id).style.display='none'; document.getElementById('tag-val-'+type+'-'+id).value=''; }
function tagKeydown(e,id,type) { if (e.key==='Enter') confirmAddTag(id,type); if (e.key==='Escape') cancelAddTag(id,type); }
function confirmAddTag(id,type) {
  const val=document.getElementById('tag-val-'+type+'-'+id).value.trim().toUpperCase(); if (!val) return;
  const field=type==='sku'?'skus':'cncs';
  if (!orders[id][field]) orders[id][field]=[];
  if (!orders[id][field].includes(val)) { orders[id][field].push(val); save(); }
  renderAll();
}
function removeTag(id,type,val) {
  if (!orders[id]) return;
  const field=type==='sku'?'skus':'cncs';
  orders[id][field]=(orders[id][field]||[]).filter(function(v){ return v!==val; });
  save(); renderAll();
}
async function addCncFromClipboard(orderId) {
  let text='';
  try { text=await navigator.clipboard.readText(); }
  catch(e) { showNotice('Could not read clipboard \u2014 try clicking the page first.','warning',5000); return; }
  const m=text.trim().match(/((?:CNC|CSA)\d{8}[A-Z]?)/i);
  if (!m) { showNotice('No CNC/CSA found in clipboard. Got: "'+text.trim().slice(0,40)+'"','warning',5000); return; }
  const val=m[1].toUpperCase();
  if (!orders[orderId].cncs) orders[orderId].cncs=[];
  if (!orders[orderId].cncs.includes(val)) { orders[orderId].cncs.push(val); save(); renderAll(); showNotice('Added '+val+' to '+orderId,'success',2500); }
  else showNotice(val+' already on this order','info',2500);
}
async function copyOrderId(id) {
  copiedOrderId=id;
  try { await navigator.clipboard.writeText(id); }
  catch(e) { const ta=document.createElement('textarea'); ta.value=id; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  renderTable();
  showNotice('Copied '+id+' to clipboard','info',2000);
}

// ── Remove / archive ──────────────────────────────────────────────────────────
function confirmRemoveOrder(id) {
  showModal('Archive '+id+'?', 'Move to history. You can view or delete it there.', [
    { label:'Archive', cls:'danger', action:function() {
      const archived=Object.assign({},orders[id],{archivedAt:new Date().toISOString().slice(0,10)});
      delete archived.hasCustomerOrders;
      history_orders[id]=archived; delete orders[id]; save(); saveHistory(); renderAll(); closeModal();
    }},
    { label:'Cancel', cls:'', action:closeModal }
  ]);
}
function confirmDeleteArchived(id) {
  showModal('Delete '+id+' from history?', 'This cannot be undone.', [
    { label:'Delete', cls:'danger', action:function(){ delete history_orders[id]; saveHistory(); renderAll(); closeModal(); }},
    { label:'Cancel', cls:'', action:closeModal }
  ]);
}
function confirmClearAll() {
  showModal('Clear all active orders?', Object.keys(orders).length+' orders will be deleted (not archived).', [
    { label:'Clear all', cls:'danger', action:function(){ orders={}; save(); renderAll(); closeModal(); }},
    { label:'Cancel', cls:'', action:closeModal }
  ]);
}
function confirmClearHistory() {
  showModal('Clear history?', Object.keys(history_orders).length+' archived orders ('+historyKB()+' KB) will be permanently deleted.', [
    { label:'Clear history', cls:'danger', action:function(){ history_orders={}; saveHistory(); renderAll(); closeModal(); }},
    { label:'Cancel', cls:'', action:closeModal }
  ]);
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function showModal(title,body,actions) {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').textContent=body;
  const el=document.getElementById('modal-actions'); el.innerHTML='';
  actions.forEach(function(a){
    const btn=document.createElement('button'); btn.textContent=a.label;
    if (a.cls) btn.className=a.cls; btn.onclick=a.action; el.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', function(e){ if (e.target===this) closeModal(); });

// ── Misc ──────────────────────────────────────────────────────────────────────
function clearSearch() {
  document.getElementById('sku-search').value='';
  document.getElementById('id-search').value='';
  qtyFilter='all'; skuFilter='all'; ageFilter='all';
  renderTable();
}
let noticeTimer=null;
function showNotice(msg,type,ms) {
  const el=document.getElementById('notices');
  el.innerHTML='<div class="notice-box '+type+'">'+msg+'</div>';
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(function(){ el.innerHTML=''; }, ms||4000);
}

document.getElementById('btn-export').addEventListener('click', doExport);
document.getElementById('btn-copy-full').addEventListener('click', copyFullExport);
document.getElementById('btn-import').addEventListener('click', doImport);
document.getElementById('btn-clear-import').addEventListener('click', clearImportUI);

load();
renderAll();
</script>
</body>
</html>
